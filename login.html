<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de Usuario | Universidad NovaTech del Valle</title>

    <!-- PRECONEXIÓN RÁPIDA -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --bg-main: #fcf8f2;
            --green-ghibli: #2c5339;
            --green-light: #e8f0e9;
            --terracotta: #9b3e22;
            --wood-dark: #1b2822;
            --text-dark: #222222;
            --border-soft: #d3cdbf;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, rgba(27, 40, 34, 0.9), rgba(44, 83, 57, 0.8)), url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1400&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-main);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border-soft);
            text-align: center;
        }

        .login-logo {
            width: 60px;
            height: 60px;
            background: var(--green-ghibli);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            font-size: 26px;
            margin: 0 auto 15px auto;
        }

        .login-card h1 {
            font-size: 24px;
            color: var(--wood-dark);
            margin-bottom: 5px;
        }

        .login-card p {
            font-size: 13px;
            color: #555555;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .campo-login {
            text-align: left;
            margin-bottom: 20px;
        }

        .campo-login label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--wood-dark);
            margin-bottom: 6px;
        }

        .input-grupo {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-grupo i {
            position: absolute;
            left: 12px;
            color: var(--green-ghibli);
            font-size: 14px;
        }

        .campo-login input {
            width: 100%;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            padding: 11px 12px 11px 38px;
            font-size: 13px;
            outline: none;
            background: #ffffff;
            transition: 0.3s;
        }

        .campo-login input:focus {
            border-color: var(--green-ghibli);
            box-shadow: 0 0 5px rgba(44, 83, 57, 0.2);
        }

        .btn-ingresar {
            width: 100%;
            border: none;
            background: var(--green-ghibli);
            color: white;
            padding: 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-ingresar:hover {
            background: #1b2822;
        }

        #mensajeError {
            margin-top: 15px;
            font-size: 12px;
            font-weight: 700;
            color: var(--terracotta);
            display: none;
        }

        .footer-login {
            margin-top: 25px;
            font-size: 11px;
            color: #666666;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-logo">
            <i class="fa-solid fa-tree"></i>
        </div>
        <h1>UNOVA</h1>
        <p>Universidad NovaTech del Valle</p>

        <form id="formLogin">
            <div class="campo-login">
                <label for="usuario">Correo Institucional</label>
                <div class="input-grupo">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="usuario" placeholder="usuario@unova.edu.mx" required>
                </div>
            </div>

            <div class="campo-login">
                <label for="password">Contraseña</label>
                <div class="input-grupo">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-ingresar">Ingresar al Portal</button>
            <div id="mensajeError">Por favor, completa los campos correctamente.</div>
        </form>

        <div class="footer-login">
            <p>© 2026 UNOVA. Acceso restringido a personal autorizado.</p>
        </div>
    </div>

    <!-- JQUERY Y SCRIPT DE VALIDACIÓN DINÁMICA -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#formLogin").submit(function (e) {
                e.preventDefault();

                let usuario = $.trim($("#usuario").val());
                let password = $.trim($("#password").val());

                if (usuario === "" || password === "") {
                    $("#mensajeError").text("Todos los campos son obligatorios.").fadeIn();
                    return;
                }

                // Simulación de validación profesional y redirección dinámica al index principal
                $("#mensajeError").hide();
                
                // Efecto visual de carga exitosa
                $(".btn-ingresar").text("Verificando acceso...").css("background", "#9b3e22");

                setTimeout(function () {
                    // Redirección obligatoria al contenido de la página principal
                    window.location.href = "index.html";
                }, 1000);
            });
        });
    </script>
</body>
</html>
