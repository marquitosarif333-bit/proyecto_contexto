<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universidad NovaTech del Valle | Contacto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body style="text-align: center;">
    <header id="header">
        <div class="contenedor-header" style="max-width:1250px; margin:auto; display:flex; align-items:center; justify-content:space-between; height:75px;">
            <div class="logo" style="display:flex; align-items:center; gap:10px;">
                <div class="logo-icono"><i class="fa-solid fa-tree"></i></div>
                <div class="logo-texto" style="text-align:left;">
                    <h1>UNOVA</h1>
                    <span>Universidad NovaTech del Valle</span>
                </div>
            </div>
            <nav id="menu">
                <a href="index.html" class="enlace-menu">Inicio</a>
                <a href="nosotros.html" class="enlace-menu">Nosotros</a>
                <a href="menu.html" class="enlace-menu">Menú</a>
                <a href="contacto.html" class="enlace-menu activo boton-contacto">Contacto</a>
            </nav>
        </div>
    </header>

    <main style="margin-top: 100px;">
        <section id="contacto" class="seccion fondo-gris">
            <div class="contenedor" style="max-width:800px; margin:auto;">
                <div class="titulo-seccion">
                    <span>ESTAMOS PARA AYUDARTE</span>
                    <h2>Contacto</h2>
                    <div class="linea"></div>
                </div>

                <div class="formulario" style="text-align:left; background:white; padding:30px; border-radius:12px; margin:0 auto; border:1px solid #e2ded4;">
                    <h3>Solicita información</h3>
                    <form id="formContacto">
                        <div class="campo" style="margin-bottom:15px;"><label for="nombre" style="display:block; font-size:12px; font-weight:700; margin-bottom:5px;">Nombre</label><input type="text" id="nombre" placeholder="Nombre" style="width:100%; border:1px solid #e2ded4; border-radius:8px; padding:10px; font-size:12px; outline:none;"></div>
                        <div class="campo" style="margin-bottom:15px;"><label for="correo" style="display:block; font-size:12px; font-weight:700; margin-bottom:5px;">Correo</label><input type="email" id="correo" placeholder="Correo" style="width:100%; border:1px solid #e2ded4; border-radius:8px; padding:10px; font-size:12px; outline:none;"></div>
                        <div class="campo" style="margin-bottom:15px;"><label for="asunto" style="display:block; font-size:12px; font-weight:700; margin-bottom:5px;">Asunto</label><select id="asunto" style="width:100%; border:1px solid #e2ded4; border-radius:8px; padding:10px; font-size:12px; outline:none;"><option value="">Selecciona</option><option value="admisiones">Admisiones</option></select></div>
                        <div class="campo" style="margin-bottom:15px;"><label for="mensaje" style="display:block; font-size:12px; font-weight:700; margin-bottom:5px;">Mensaje</label><textarea id="mensaje" rows="4" placeholder="Mensaje" style="width:100%; border:1px solid #e2ded4; border-radius:8px; padding:10px; font-size:12px; outline:none;"></textarea></div>
                        <button type="submit" class="btn-formulario" style="width:100%; border:none; background:#4a7c59; color:white; padding:12px; border-radius:18px; font-weight:700; cursor:pointer;">Enviar</button>
                    </form>
                    <div id="mensajeFormulario"></div>
                </div>
            </div>
        </section>
    </main>

    <footer style="background:#2c3e35; color:white; padding:30px 20px;">
        <div class="redes-sociales" style="display:flex; justify-content:center; gap:20px; margin-bottom:15px;">
            <a href="#" aria-label="Facebook" style="color:white; font-size:20px;"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" aria-label="Instagram" style="color:white; font-size:20px;"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" aria-label="Twitter" style="color:white; font-size:20px;"><i class="fa-brands fa-twitter"></i></a>
            <a href="#" aria-label="LinkedIn" style="color:white; font-size:20px;"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
        <div class="footer-bottom" style="color:#839489; font-size:11px;">
            <p>© 2026 Universidad NovaTech del Valle. Todos los derechos reservados.</p>
        </div>
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/funciones.js"></script>
</body>
</html>
